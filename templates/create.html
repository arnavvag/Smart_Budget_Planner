{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4 mt-4 mb-4">
  <h3 class="mb-3 text-center text-primary fw-bold">Create Smart Budget</h3>
  <form id="budgetForm" action="{{ url_for('optimize') }}" method="post" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Total Monthly Budget (₹)</label>
        <input type="number" step="0.01" class="form-control" name="budget" required value="30000">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Generations</label>
        <input type="number" class="form-control" name="generations" value="300">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Population Size</label>
        <input type="number" class="form-control" name="pop" value="200">
      </div>
    </div>

    <hr class="my-4">

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="fw-bold text-secondary">Categories</h5>
      <div>
        <button type="button" class="btn btn-sm btn-outline-primary me-2" id="addRowBtn">+ Add Category</button>
        <div class="btn-group">
          <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Presets</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item preset-btn" href="#" data-preset="Student">Student</a></li>
            <li><a class="dropdown-item preset-btn" href="#" data-preset="Family">Family</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="categories">
      {% for r in sample %}
      <div class="row g-2 align-items-end category-row mb-2">
        <div class="col-md-3"><label class="form-label">Name</label><input name="name[]" class="form-control" value="{{ r.name }}"></div>
        <div class="col-md-2"><label class="form-label">Min (₹)</label><input name="min[]" class="form-control" value="{{ r.min }}"></div>
        <div class="col-md-2"><label class="form-label">Max (₹)</label><input name="max[]" class="form-control" value="{{ r.max }}"></div>
        <div class="col-md-2"><label class="form-label">Priority (1-10)</label><input name="priority[]" type="number" min="1" max="10" class="form-control" value="{{ r.priority }}"></div>
        <div class="col-md-2"><label class="form-label">Alpha</label><input name="alpha[]" class="form-control" value="{{ r.alpha }}"></div>
        <div class="col-md-1"><button type="button" class="btn btn-danger remove-row">Remove</button></div>
      </div>
      {% endfor %}
    </div>

    <div class="mt-3">
      <label class="form-label fw-semibold">Or upload CSV <small class="text-muted">(optional)</small></label>
      <input type="file" class="form-control" name="config" accept=".csv">
    </div>

    <div class="mt-4 text-end">
      <button type="submit" class="btn btn-success btn-lg">Optimize Now</button>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const addBtn = document.getElementById('addRowBtn');
  addBtn.addEventListener('click', addRow);

  document.getElementById('categories').addEventListener('click', function(e){
    if(e.target && e.target.classList.contains('remove-row')){
      e.target.closest('.category-row').remove();
    }
  });

  document.querySelectorAll('.preset-btn').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.preventDefault();
      const name = ev.target.dataset.preset;
      const presets = {
        "Student": JSON.parse('{{ presets["Student"]|tojson|safe }}'),
        "Family": JSON.parse('{{ presets["Family"]|tojson|safe }}')
      };
      populatePreset(presets[name]);
    });
  });
});

function addRow(){
  const container = document.getElementById('categories');
  const html = `
  <div class="row g-2 align-items-end category-row mb-2">
    <div class="col-md-3"><label class="form-label">Name</label><input name="name[]" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Min (₹)</label><input name="min[]" class="form-control" value="0"></div>
    <div class="col-md-2"><label class="form-label">Max (₹)</label><input name="max[]" class="form-control" value="0"></div>
    <div class="col-md-2"><label class="form-label">Priority (1-10)</label><input name="priority[]" type="number" min="1" max="10" class="form-control" value="5"></div>
    <div class="col-md-2"><label class="form-label">Alpha</label><input name="alpha[]" class="form-control" value="0.0005"></div>
    <div class="col-md-1"><button type="button" class="btn btn-danger remove-row">Remove</button></div>
  </div>`;
  container.insertAdjacentHTML('beforeend', html);
}

function populatePreset(rows){
  const container = document.getElementById('categories');
  container.innerHTML = '';
  rows.forEach(r=>{
    const html = `
    <div class="row g-2 align-items-end category-row mb-2">
      <div class="col-md-3"><label class="form-label">Name</label><input name="name[]" class="form-control" value="${r.name}"></div>
      <div class="col-md-2"><label class="form-label">Min (₹)</label><input name="min[]" class="form-control" value="${r.min}"></div>
      <div class="col-md-2"><label class="form-label">Max (₹)</label><input name="max[]" class="form-control" value="${r.max}"></div>
      <div class="col-md-2"><label class="form-label">Priority (1-10)</label><input name="priority[]" type="number" min="1" max="10" class="form-control" value="${r.priority}"></div>
      <div class="col-md-2"><label class="form-label">Alpha</label><input name="alpha[]" class="form-control" value="${r.alpha}"></div>
      <div class="col-md-1"><button type="button" class="btn btn-danger remove-row">Remove</button></div>
    </div>`;
    container.insertAdjacentHTML('beforeend', html);
  });
}
</script>
{% endblock %}
