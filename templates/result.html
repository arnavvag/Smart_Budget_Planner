{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow-sm">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-0">Optimized Allocation</h3>
      <small class="text-muted">Generated: {{ timestamp }}</small>
    </div>
    <div>
      <a href="{{ url_for('download_csv') }}" class="btn btn-outline-primary me-2">Download CSV</a>
      <a href="{{ url_for('download_pdf') }}" class="btn btn-outline-secondary">Download PDF</a>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-6">
      <table class="table table-striped">
        <thead><tr><th>Category</th><th>Amount (₹)</th></tr></thead>
        <tbody>
          {% for k,v in allocation.items() %}
          <tr><td>{{ k }}</td><td>₹{{ "%.2f"|format(v) }}</td></tr>
          {% endfor %}
        </tbody>
      </table>

      <div class="mt-3">
        <form action="{{ url_for('predict') }}" method="post" class="row g-2 align-items-end">
          <div class="col-auto"><label class="form-label">Predict for new budget (₹)</label><input name="new_budget" class="form-control" placeholder="e.g. 35000"></div>
          <div class="col-auto"><button class="btn btn-outline-success">Scale Allocation</button></div>
          <div class="col-auto"><a href="{{ url_for('create') }}" class="btn btn-link">Recreate</a></div>
        </form>
      </div>
    </div>

    <div class="col-md-6">
      <div class="d-flex justify-content-between align-items-center">
        <h6>Visualizations</h6>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="toggleChart">Toggle Pie/Bar</button>
        </div>
      </div>
      <canvas id="chartCanvas" style="max-height:400px;"></canvas>
    </div>
  </div>

</div>

<script>
const labels = {{ labels|tojson }};
const values = {{ values|tojson }};
let currentType = 'pie';

const ctx = document.getElementById('chartCanvas').getContext('2d');
let chart = new Chart(ctx, {
  type: currentType,
  data: {
    labels: labels,
    datasets: [{
      label: 'Allocation',
      data: values
    }]
  },
  options: { responsive: true }
});

document.getElementById('toggleChart').addEventListener('click', function(){
  currentType = (currentType === 'pie') ? 'bar' : 'pie';
  chart.destroy();
  chart = new Chart(ctx, {
    type: currentType,
    data: {
      labels: labels,
      datasets: [{
        label: 'Allocation',
        data: values
      }]
    },
    options: { responsive: true }
  });
});
</script>
{% endblock %}
